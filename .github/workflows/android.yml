name: Android validation
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      # Ubuntu 24.04 already provides Android command-line tools and licenses.
      - name: Verify preinstalled Android build packages
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - name: Validate update release rules
        if: ${{ github.repository == 'alitrial2025/netflix-tv' }}
        run: node --test tools/update-gate/release-lib.test.mjs
      - name: Validate marketing and playback diagnostics
        if: ${{ github.repository == 'alitrial2025/netflix-tv' }}
        run: node --test marketing-site/tests/release-policy.test.mjs tools/cdn-audit/season-catalog-audit.test.mjs tools/cdn-audit/probe.test.mjs tools/cdn-audit/audit-profiles.test.mjs tools/public-playback/public-catalog-flow.test.mjs
      - name: Validate provider identity refresh
        run: node --test tools/public-playback/partner-catalog.test.mjs tools/public-playback/provider-feed.test.mjs tools/public-playback/public-catalog-flow.test.mjs
      - name: Build debug APK
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug
      - name: Run unit tests
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest
      - name: Android lint
        if: ${{ !cancelled() }}
        run: ./gradlew --no-daemon --max-workers=2 :app:lintDebug
      - name: Save APK and validation reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-debug-and-reports
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            app/build/test-results/

  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Test membership and discovery rules
        working-directory: tools/discovery-validation
        run: |
          npm ci
          npm test
  release:
    if: github.event_name != 'pull_request'
    needs: [debug, rules]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Restore release signing and client payment configuration
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          PAYHERO_API_AUTH: ${{ secrets.PAYHERO_API_AUTH }}
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          def property_value(v):
              return v.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          assert all(os.environ[k] for k in ['KEYSTORE','STORE_PASSWORD','KEY_PASSWORD','KEY_ALIAS']), 'Release signing secrets are required'
          Path('app/release.jks').write_bytes(base64.b64decode(os.environ['KEYSTORE']))
          values={'storeFile':'release.jks','storePassword':os.environ['STORE_PASSWORD'],'keyPassword':os.environ['KEY_PASSWORD'],'keyAlias':os.environ['KEY_ALIAS']}
          Path('app/release-signing.properties').write_text(''.join(k+'='+property_value(v)+'\n' for k,v in values.items()))
          if os.environ['PAYHERO_API_AUTH']:
              Path('.env').write_text('PAYHERO_API_AUTH='+property_value(os.environ['PAYHERO_API_AUTH'])+'\n')
          PY
      - name: Build and lint signed obfuscated release
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleRelease :app:lintRelease
      - name: Verify signature and production manifest
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging app/build/outputs/apk/release/app-release.apk > release-badging.txt
          ! grep -q 'application-debuggable' release-badging.txt
          test -s app/build/outputs/mapping/release/mapping.txt
          test -s app/build/outputs/mapping/release/usage.txt
      - name: Verify R8 preserves suspend API response types
        run: python3 tools/release-validation/check-retrofit-dex.py --apk app/build/outputs/apk/release/app-release.apk --mapping app/build/outputs/mapping/release/mapping.txt --api com.example.api.TmdbApiService
      - name: Save signed release APK
        uses: actions/upload-artifact@v5
        with:
          name: signed-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/output-metadata.json
            release-badging.txt
      - name: Encrypt release symbols
        env:
          SYMBOLS_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          tar -czf release-symbols.tar.gz -C app/build/outputs/mapping release
          printf '%s' "$SYMBOLS_PASSWORD" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output release-symbols.tar.gz.gpg release-symbols.tar.gz
          rm -f release-symbols.tar.gz
      - name: Save encrypted symbols and release reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: release-symbols-and-reports
          path: |
            release-symbols.tar.gz.gpg
            app/build/reports/
      - name: Remove temporary credentials
        if: always()
        run: rm -f app/release.jks app/release-signing.properties .env

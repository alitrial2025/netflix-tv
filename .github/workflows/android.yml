name: Android validation
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build packages
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0'
      - name: Validate update release rules
        if: ${{ github.repository == 'alitrial2025/netflix-tv' }}
        run: node --test tools/update-gate/release-lib.test.mjs
      - name: Build debug APK
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug
      - name: Run unit tests
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest
      - name: Android lint
        if: ${{ !cancelled() }}
        run: ./gradlew --no-daemon --max-workers=2 :app:lintDebug
      - name: Save APK and validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-and-reports
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            app/build/test-results/

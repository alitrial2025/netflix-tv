name: Native provider playback audit
on:
  push:
    branches: [fix/provider-identity]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-playback-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  playback:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Install opt-in audit into cloud test sources
        run: cp tools/public-playback/native-audit/PublicPlaybackLiveAuditTest.kt app/src/test/java/com/example/data/
      - name: Resolve through production Kotlin and fetch issued media segments
        env:
          NPRO_PLAYBACK_AUDIT_OUTPUT: ${{ github.workspace }}/out/playback-audit.json
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest --tests com.example.data.PublicPlaybackLiveAuditTest
      - name: Save sanitized audit and diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: native-provider-playback-audit
          if-no-files-found: warn
          path: |
            out/playback-audit.json
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
